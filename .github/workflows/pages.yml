# Kiểm thử logic rồi đăng game lên GitHub Pages mỗi khi đẩy code lên nhánh main.
# Bật một lần: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Kiểm thử & đăng game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp JS
        run: for f in $(find js -name '*.js') sw.js; do node --check "$f"; done
      - name: Kiểm thử logic game
        run: node --test tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
